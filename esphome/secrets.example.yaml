# Copy to secrets.yaml (which is gitignored) and fill in.
#
#   cp secrets.example.yaml secrets.yaml
#
# Generate the api_key with:  openssl rand -base64 32

wifi_ssid: "yourwifissid"
wifi_password: "yourwifipw"

# Password for the fallback access point the device raises if WiFi fails.
ap_password: "yourfallbackpw"

# Home Assistant native API encryption key, base64, 32 bytes.
api_key: "REPLACE_WITH_openssl_rand_base64_32"

ota_password: "yourotapw"
