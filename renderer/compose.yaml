services:
  frame-renderer:
    build: .
    image: frame-renderer:latest
    container_name: frame-renderer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # config.yaml is re-read on every request, so edits here need no restart.
      - ./config:/config:ro
    environment:
      # Prefer the token here (or in a .env file next to this compose file)
      # over writing it into config.yaml.
      HA_TOKEN: "${HA_TOKEN:?set HA_TOKEN in .env or the environment}"
      TZ: "${TZ:-Europe/Berlin}"
    # Chromium is unhappy with Docker's default 64 MB /dev/shm. The browser is
    # also launched with --disable-dev-shm-usage, so this is belt and braces.
    shm_size: "256m"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
